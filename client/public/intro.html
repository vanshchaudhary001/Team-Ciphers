<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StartSmart — Your First 5 Days</title>
  <meta name="description" content="StartSmart intro: your first five days of onboarding, one step at a time.">
  <link rel="icon" type="image/png" href="start-smart-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">

  <script>
    // Return to the page that triggered the intro, telling it not to redirect again.
    function goHome() {
      var to = '/';
      try {
        var saved = sessionStorage.getItem('startsmart_intro_return');
        if (saved && saved.charAt(0) === '/' && saved.charAt(1) !== '/') to = saved;
        sessionStorage.removeItem('startsmart_intro_return');
        sessionStorage.setItem('startsmart_intro_done', '1');
      } catch (e) { }
      window.location.replace(to);
    }

    // Reduced motion: skip the intro entirely.
    (function () {
      try {
        if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
          goHome();
        }
      } catch (e) { }
    })();
  </script>

  <style>
    /* Brand tokens mirrored from client/styles.css */
    :root {
      --primary: #0037b0;
      --primary-container: #1d4ed8;
      --accent: #3b82f6;
      --surface: #f8f9ff;
      --surface-low: #eff4ff;
      --ink: #0b1c30;
      --ink-variant: #434655;
      --outline-subtle: rgba(196, 197, 215, 0.45);
      --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: linear-gradient(180deg, #dbe6ff 0%, var(--surface) 100%);
      font-family: var(--font-sans);
      color: var(--ink);
    }

    #scene {
      position: fixed;
      inset: 0;
      display: block;
      width: 100%;
      height: 100%;
    }

    .brand {
      position: fixed;
      top: 20px;
      left: 24px;
      z-index: 5;
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 800;
      font-size: 1.05rem;
      letter-spacing: -0.01em;
      color: var(--ink);
    }

    .brand img { width: 34px; height: 34px; object-fit: contain; }

    .skip-btn {
      position: fixed;
      top: 18px;
      right: 20px;
      z-index: 10;
      padding: 9px 16px;
      border-radius: 999px;
      border: 1px solid var(--outline-subtle);
      background: rgba(255, 255, 255, 0.72);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      color: var(--ink-variant);
      font: 600 0.85rem var(--font-sans);
      cursor: pointer;
      transition: background 0.2s, color 0.2s;
    }

    .skip-btn:hover { background: #fff; color: var(--primary); }
    .skip-btn:focus-visible, .cta-btn:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }

    .progress {
      position: fixed;
      left: 50%;
      bottom: 28px;
      transform: translateX(-50%);
      z-index: 5;
      display: flex;
      gap: 8px;
      transition: opacity 0.6s;
    }

    .progress span {
      padding: 6px 12px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.6);
      border: 1px solid var(--outline-subtle);
      color: var(--ink-variant);
      font: 600 0.72rem var(--font-sans);
      letter-spacing: 0.06em;
      white-space: nowrap;
      transition: background 0.35s, color 0.35s, border-color 0.35s, transform 0.35s;
    }

    .progress span.on {
      background: var(--primary);
      border-color: var(--primary);
      color: #fff;
      transform: translateY(-2px);
    }

    .finale {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 12vh;
      z-index: 6;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
      padding: 0 16px;
      text-align: center;
      opacity: 0;
      transform: translateY(14px);
      pointer-events: none;
      transition: opacity 0.9s ease, transform 0.9s ease;
    }

    .finale.show { opacity: 1; transform: none; pointer-events: auto; }

    .finale h1 {
      font-size: clamp(1.8rem, 4.6vw, 3.2rem);
      font-weight: 800;
      letter-spacing: -0.03em;
      line-height: 1.08;
      color: var(--ink);
      text-shadow: 0 2px 24px rgba(248, 249, 255, 0.9);
    }

    .finale h1 em { font-style: normal; color: var(--primary); }

    .finale p {
      font-size: clamp(0.95rem, 1.6vw, 1.1rem);
      color: var(--ink-variant);
      text-shadow: 0 1px 12px rgba(248, 249, 255, 0.9);
    }

    .cta-btn {
      margin-top: 6px;
      padding: 14px 30px;
      border: 0;
      border-radius: 12px;
      background: linear-gradient(135deg, var(--primary), var(--primary-container));
      color: #fff;
      font: 700 1rem var(--font-sans);
      cursor: pointer;
      box-shadow: 0 10px 30px rgba(0, 55, 176, 0.28);
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .cta-btn:hover { transform: translateY(-2px); box-shadow: 0 14px 34px rgba(0, 55, 176, 0.34); }

    .loader {
      position: fixed;
      inset: 0;
      z-index: 8;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      background: linear-gradient(180deg, #dbe6ff 0%, var(--surface) 100%);
      transition: opacity 0.6s ease;
    }

    .loader.hide { opacity: 0; pointer-events: none; }
    .loader-label { font: 600 0.85rem var(--font-sans); color: var(--ink-variant); letter-spacing: 0.04em; }

    .loader-bar {
      width: min(220px, 60vw);
      height: 4px;
      border-radius: 4px;
      background: rgba(0, 55, 176, 0.12);
      overflow: hidden;
    }

    .loader-bar i {
      display: block;
      width: 8%;
      height: 100%;
      background: var(--primary);
      transition: width 0.25s ease;
    }

    /* 2D fallback when WebGL or the model is unavailable */
    .fallback {
      position: fixed;
      inset: 0;
      z-index: 7;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 28px;
      padding: 16px;
    }

    .fallback.show { display: flex; }

    .fb-stairs { display: flex; align-items: flex-end; gap: 4px; }

    .fb-stairs div {
      width: clamp(52px, 13vw, 96px);
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding-top: 10px;
      border-radius: 6px 6px 0 0;
      background: linear-gradient(180deg, #ffffff, #dfe6f5);
      box-shadow: 0 6px 18px rgba(11, 28, 48, 0.1);
      color: var(--ink);
      font: 800 clamp(0.65rem, 2vw, 0.85rem) var(--font-sans);
      letter-spacing: 0.04em;
      opacity: 0;
      animation: fb-rise 0.5s ease forwards;
    }

    .fb-stairs div:nth-child(1) { height: 50px; animation-delay: 0.1s; }
    .fb-stairs div:nth-child(2) { height: 90px; animation-delay: 0.35s; }
    .fb-stairs div:nth-child(3) { height: 130px; animation-delay: 0.6s; }
    .fb-stairs div:nth-child(4) { height: 170px; animation-delay: 0.85s; }
    .fb-stairs div:nth-child(5) { height: 210px; animation-delay: 1.1s; border-top: 3px solid var(--accent); }

    @keyframes fb-rise { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: none; } }

    .fallback .finale { position: static; opacity: 1; transform: none; pointer-events: auto; }

    @media (max-width: 600px) {
      .brand { top: 16px; left: 16px; font-size: 0.95rem; }
      .brand img { width: 28px; height: 28px; }
      .skip-btn { top: 14px; right: 16px; }
      .progress { bottom: 18px; gap: 5px; }
      .progress span { padding: 5px 8px; font-size: 0.65rem; }
      .finale { bottom: 10vh; }
    }
  </style>

    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",

<body>
  <canvas id="scene" aria-hidden="true"></canvas>

  <div class="brand">
    <img src="start-smart-logo-transparent.png" alt="">
    <span>StartSmart</span>
  </div>

  <button class="skip-btn" id="skipBtn" type="button">Skip intro →</button>

  <div class="progress" id="progress" aria-hidden="true">
    <span>DAY 1</span><span>DAY 2</span><span>DAY 3</span><span>DAY 4</span><span>DAY 5</span>
  </div>

  <div class="finale" id="finale" role="region" aria-live="polite">
    <h1>Your first <em>5 days</em>, mapped.</h1>
    <p>Every step of onboarding, one day at a time.</p>
    <button class="cta-btn" id="ctaBtn" type="button">Get Started</button>
  </div>

  <div class="loader" id="loader" role="status">
    <div class="loader-label">Preparing your first week…</div>
    <div class="loader-bar"><i id="loaderBar"></i></div>
  </div>

  <div class="fallback" id="fallback">
    <div class="fb-stairs">
      <div>DAY 1</div><div>DAY 2</div><div>DAY 3</div><div>DAY 4</div><div>DAY 5</div>
    </div>
    <div class="finale">
      <h1>Your first <em>5 days</em>, mapped.</h1>
      <p>Every step of onboarding, one day at a time.</p>
      <button class="cta-btn" id="fbCtaBtn" type="button">Get Started</button>
    </div>
  </div>

  <script>
    // Shared exit + fallback helpers (classic script so they work even if the module/CDN fails).
    window.__intro = {
      exited: false,
      started: false,
      cleanup: null,
      exit: function () {
        if (this.exited) return;
        this.exited = true;
        try { if (this.cleanup) this.cleanup(); } catch (e) { }
        goHome();
      },
      fallback: function () {
        if (this.exited || this.fellBack) return;
        this.fellBack = true;
        try { if (this.cleanup) this.cleanup(); } catch (e) { }
        document.getElementById('loader').classList.add('hide');
        document.getElementById('progress').style.display = 'none';
        document.getElementById('finale').style.display = 'none';
        document.getElementById('scene').style.display = 'none';
        document.getElementById('fallback').classList.add('show');
        var self = this;
        setTimeout(function () { self.exit(); }, 5000);
      }
    };
    document.getElementById('skipBtn').addEventListener('click', function () { window.__intro.exit(); });
    document.getElementById('ctaBtn').addEventListener('click', function () { window.__intro.exit(); });
    document.getElementById('fbCtaBtn').addEventListener('click', function () { window.__intro.exit(); });
    // If the 3D scene errors or never starts playing (CDN blocked, old browser), fall back.
    window.addEventListener('error', function () { if (!window.__intro.playing) window.__intro.fallback(); });
    setTimeout(function () { if (!window.__intro.playing) window.__intro.fallback(); }, 15000);
  </script>

  <script type="module">
    import * as THREE from 'three';
    import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
    import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';

    const intro = window.__intro;
    const labelCanvases = [];

    // ---------- Scene constants ----------
    const STEP_COUNT = 5;
    const STEP_RUN = 1.1;     // tread depth along X (metres)
    const STEP_RISE = 0.45;   // riser height (about knee height)
    const STEP_WIDTH = 2.4;   // stair width along Z
    const START_X = -2.8;
    const COLORS = {
      ink: 0x1b2a46,
      accent: 0x3b82f6,
      primary: 0x0037b0,
      fog: 0xeaf0ff,
      ground: 0xe9eef9,
    };

    // ---------- WebGL check ----------
    let renderer;
    try {
      renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('scene'), antialias: true, alpha: true, powerPreference: 'high-performance' });
    } catch (e) {
      intro.fallback();
      throw e;
    }
    intro.started = true;

    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.05;
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;

    const scene = new THREE.Scene();
    scene.fog = new THREE.Fog(COLORS.fog, 12, 26);

    const pmrem = new THREE.PMREMGenerator(renderer);
    const envRT = pmrem.fromScene(new RoomEnvironment(), 0.04);
    scene.environment = envRT.texture;
    scene.environmentIntensity = 0.55;

    const camera = new THREE.PerspectiveCamera(35, window.innerWidth / window.innerHeight, 0.1, 100);

    // ---------- Lighting ----------
    const hemi = new THREE.HemisphereLight(0xf2f6ff, 0xc9d2e6, 0.55);
    scene.add(hemi);

    const sun = new THREE.DirectionalLight(0xfff4e6, 2.6);
    sun.position.set(-4, 9, 6);
    sun.target.position.set(2, 0, 0);
    sun.castShadow = true;
    sun.shadow.mapSize.set(2048, 2048);
    sun.shadow.camera.left = -7;
    sun.shadow.camera.right = 7;
    sun.shadow.camera.top = 7;
    sun.shadow.camera.bottom = -7;
    sun.shadow.camera.near = 1;
    sun.shadow.camera.far = 30;
    sun.shadow.bias = -0.0004;
    sun.shadow.normalBias = 0.02;
    scene.add(sun, sun.target);

    const rim = new THREE.DirectionalLight(0xbcd2ff, 0.9);
    rim.position.set(6, 5, -6);
    scene.add(rim);

    // ---------- Ground ----------
    const ground = new THREE.Mesh(
      new THREE.PlaneGeometry(36, 36),
      // Ground fades out radially into the page background, so there is no hard horizon.
      new THREE.MeshStandardMaterial({ color: COLORS.ground, roughness: 0.92, metalness: 0, transparent: true, alphaMap: makeGroundFadeTexture(), depthWrite: false })
    );
    ground.position.x = 1.5;
    ground.rotation.x = -Math.PI / 2;
    ground.receiveShadow = true;
    scene.add(ground);

    // Soft contact darkening at the base of the stairs (cheap ambient-occlusion feel).
    const aoTex = makeRadialTexture();
    const stairAO = new THREE.Mesh(
      new THREE.PlaneGeometry(STEP_RUN * STEP_COUNT + 1.6, STEP_WIDTH + 1.4),
      new THREE.MeshBasicMaterial({ map: aoTex, transparent: true, opacity: 0.35, depthWrite: false })
    );
    stairAO.rotation.x = -Math.PI / 2;
    stairAO.position.set((STEP_RUN * STEP_COUNT) / 2, 0.002, 0);
    scene.add(stairAO);

    // ---------- Staircase ----------
    const concrete = makeConcreteTextures();
    const stepMat = new THREE.MeshPhysicalMaterial({
      color: 0xf3f5fa,
      map: concrete.color,
      roughnessMap: concrete.rough,
      roughness: 0.62,
      metalness: 0,
      clearcoat: 0.35,
      clearcoatRoughness: 0.45,
    });

    const steps = [];
    for (let i = 0; i < STEP_COUNT; i++) {
      const h = (i + 1) * STEP_RISE;
      const block = new THREE.Mesh(new RoundedBoxGeometry(STEP_RUN, h, STEP_WIDTH, 4, 0.035), stepMat);
      block.position.set(i * STEP_RUN + STEP_RUN / 2, h / 2, 0);
      block.castShadow = true;
      block.receiveShadow = true;
      scene.add(block);

      // Glowing nosing strip along the front edge of each tread.
      const stripMat = new THREE.MeshStandardMaterial({ color: 0xdfe6f3, emissive: COLORS.accent, emissiveIntensity: 0, roughness: 0.3 });
      const strip = new THREE.Mesh(new THREE.BoxGeometry(0.05, 0.012, STEP_WIDTH * 0.9), stripMat);
      strip.position.set(i * STEP_RUN + 0.07, h + 0.004, 0);
      scene.add(strip);

      // "DAY n" label on the camera-facing side of the block.
      const labelTex = makeLabelTexture(`DAY ${i + 1}`);
      const labelMat = new THREE.MeshStandardMaterial({
        map: labelTex,
        color: COLORS.ink,
        emissive: COLORS.accent,
        emissiveMap: labelTex,
        emissiveIntensity: 0,
        transparent: true,
        roughness: 0.55,
        polygonOffset: true,
        polygonOffsetFactor: -2,
      });
      const label = new THREE.Mesh(new THREE.PlaneGeometry(STEP_RUN * 0.86, 0.3), labelMat);
      label.position.set(i * STEP_RUN + STEP_RUN / 2, h - 0.2, STEP_WIDTH / 2 + 0.003);
      scene.add(label);

      steps.push({ stripMat, labelMat, glow: 0, lit: false });
    }

    // ---------- Path & timeline ----------
    const stepCenter = (i) => new THREE.Vector2(i * STEP_RUN + STEP_RUN / 2, (i + 1) * STEP_RISE);
    const segments = [];
    // Approach walk on the ground, then climb onto step 1.
    segments.push({ from: new THREE.Vector2(START_X, 0), to: new THREE.Vector2(-STEP_RUN / 2, 0), dur: 1.25, ease: 'in', climb: false, land: -1 });
    segments.push({ from: new THREE.Vector2(-STEP_RUN / 2, 0), to: stepCenter(0), dur: 0.8, ease: 'out', climb: true, land: 0 });
    for (let i = 1; i < STEP_COUNT; i++) {
      segments.push({ from: stepCenter(i - 1), to: stepCenter(i), dur: 0.85, ease: 'inout', climb: true, land: i });
    }

    const INTRO_HOLD = 0.5;   // idle beat before walking
    const STEP_PAUSE = 0.42;  // pause on each step as its label lights up
    let cursor = INTRO_HOLD;
    for (const s of segments) {
      s.start = cursor;
      cursor += s.dur;
      s.end = cursor;
      if (s.land >= 0) cursor += STEP_PAUSE;
    }
    const CLIMB_END = segments[segments.length - 1].end;
    const FINALE_DUR = 1.8;
    const EXIT_AFTER = CLIMB_END + FINALE_DUR + 2.0;

    // ---------- Character: stylised businessman (navy suit, teal tie, copper accents) ----------
    const HIP_Y = 0.94;
    const loaderEl = document.getElementById('loader');
    const loaderBar = document.getElementById('loaderBar');
    const rig = buildBusinessman();
    const character = rig.root;
    // The figure is built facing +Z; turn it to walk along +X.
    const modelYaw = Math.PI / 2;
    character.rotation.y = modelYaw;
    character.position.set(START_X, 0, 0.15);
    scene.add(character);

    const fontReady = document.fonts && document.fonts.load ? document.fonts.load('800 100px Inter').catch(() => { }) : Promise.resolve();
    fontReady.then(() => {
      refreshLabelTextures();
      loaderBar.style.width = '100%';
      setTimeout(start, 150);
    });

    function buildBusinessman() {
      const mats = {
        suit: new THREE.MeshPhysicalMaterial({ color: 0x1b2847, roughness: 0.74, sheen: 0.7, sheenRoughness: 0.75, sheenColor: 0x5d73a3 }),
        shirt: new THREE.MeshStandardMaterial({ color: 0xf3f5f9, roughness: 0.6 }),
        tie: new THREE.MeshPhysicalMaterial({ color: 0x0f766e, roughness: 0.4, sheen: 0.5, sheenColor: 0x5eead4 }),
        copper: new THREE.MeshStandardMaterial({ color: 0xb87333, metalness: 0.85, roughness: 0.32 }),
        skin: new THREE.MeshPhysicalMaterial({ color: 0xd8a888, roughness: 0.52, sheen: 0.25, sheenColor: 0xffd9c4 }),
        hair: new THREE.MeshPhysicalMaterial({ color: 0x2b1d14, roughness: 0.62, sheen: 0.7, sheenRoughness: 0.45, sheenColor: 0x7a5538, side: THREE.DoubleSide }),
        shoe: new THREE.MeshPhysicalMaterial({ color: 0x0e0f13, roughness: 0.28, clearcoat: 1, clearcoatRoughness: 0.15 }),
      };
      const add = (parent, geo, mat, x = 0, y = 0, z = 0) => {
        const m = new THREE.Mesh(geo, mat);
        m.position.set(x, y, z);
        m.castShadow = true;
        m.receiveShadow = true;
        parent.add(m);
        return m;
      };
      const limb = (parent, len, r, mat) => add(parent, new THREE.CapsuleGeometry(r, Math.max(0.01, len - r), 6, 16), mat, 0, -len / 2, 0);

      const root = new THREE.Group();
      const pelvis = new THREE.Group();
      pelvis.position.y = HIP_Y;
      root.add(pelvis);
      add(pelvis, new THREE.SphereGeometry(1, 24, 16), mats.suit).scale.set(0.175, 0.11, 0.115);

      // Legs: hip -> knee -> ankle
      const hips = [], knees = [];
      for (const side of [1, -1]) {
        const hip = new THREE.Group();
        hip.position.set(0.092 * side, -0.02, 0);
        pelvis.add(hip);
        limb(hip, 0.45, 0.074, mats.suit);
        const knee = new THREE.Group();
        knee.position.y = -0.45;
        hip.add(knee);
        limb(knee, 0.43, 0.062, mats.suit);
        const ankle = new THREE.Group();
        ankle.position.y = -0.43;
        knee.add(ankle);
        add(ankle, new RoundedBoxGeometry(0.1, 0.07, 0.27, 3, 0.03), mats.shoe, 0, -0.03, 0.055);
        hips.push(hip);
        knees.push(knee);
      }

      // Torso: tailored jacket (lathe profile, flattened front-to-back)
      const torso = new THREE.Group();
      torso.position.y = 0.02;
      pelvis.add(torso);
      const profile = [[0.001, -0.15], [0.168, -0.15], [0.172, -0.06], [0.158, 0.1], [0.175, 0.3], [0.198, 0.42], [0.175, 0.5], [0.09, 0.545], [0.001, 0.55]]
        .map(([r, y]) => new THREE.Vector2(r, y));
      add(torso, new THREE.LatheGeometry(profile, 40), mats.suit).scale.z = 0.62;

      // Shirt V, tie, buttons, pocket square
      const front = (y) => 0.62 * (y > 0.3 ? 0.175 + (y - 0.3) * 0.19 : 0.158 + Math.max(0, y - 0.1) * 0.085) + 0.004;
      const vShape = new THREE.Shape([new THREE.Vector2(-0.062, 0), new THREE.Vector2(0.062, 0), new THREE.Vector2(0, -0.2)]);
      const shirtV = add(torso, new THREE.ShapeGeometry(vShape), mats.shirt, 0, 0.53, front(0.45));
      shirtV.rotation.x = -0.12;
      const tieShape = new THREE.Shape([new THREE.Vector2(-0.016, 0), new THREE.Vector2(0.016, 0), new THREE.Vector2(0.026, -0.17), new THREE.Vector2(0, -0.2), new THREE.Vector2(-0.026, -0.17)]);
      const tie = add(torso, new THREE.ShapeGeometry(tieShape), mats.tie, 0, 0.515, front(0.45) + 0.004);
      tie.rotation.x = -0.12;
      add(torso, new THREE.SphereGeometry(0.009, 10, 8), mats.copper, 0, 0.2, front(0.2) - 0.001);
      add(torso, new THREE.SphereGeometry(0.009, 10, 8), mats.copper, 0, 0.11, front(0.11) - 0.002);
      const pocket = add(torso, new THREE.BoxGeometry(0.05, 0.016, 0.01), mats.copper, 0.095, 0.37, front(0.37) - 0.012);
      pocket.rotation.x = -0.1;

      // Collar + neck + head
      const collar = add(torso, new THREE.TorusGeometry(0.052, 0.016, 10, 24), mats.shirt, 0, 0.545, 0);
      collar.rotation.x = Math.PI / 2;
      add(torso, new THREE.CylinderGeometry(0.046, 0.05, 0.11, 16), mats.skin, 0, 0.59, 0);
      const head = new THREE.Group();
      head.position.y = 0.64;
      torso.add(head);
      add(head, new THREE.SphereGeometry(0.1, 32, 24), mats.skin, 0, 0.115, 0.005).scale.set(0.9, 1.17, 1.0);
      // Hair: short tapered sides, fuller top with a side part, swept-up front quiff.
      // A tilted cap around the skull puts the hairline high at the front and low at the nape.
      const hairSides = add(head, new THREE.SphereGeometry(1, 40, 20, 0, Math.PI * 2, 0, Math.PI * 0.47), mats.hair, 0, 0.115, 0.005);
      hairSides.scale.set(0.1, 0.127, 0.122);
      hairSides.rotation.x = -0.55;
      const hairTop = add(head, new THREE.SphereGeometry(1, 32, 20), mats.hair, 0.008, 0.205, 0.004);
      hairTop.scale.set(0.072, 0.05, 0.1);
      hairTop.rotation.set(-0.15, 0, 0.1);
      const quiff = add(head, new THREE.SphereGeometry(1, 28, 16), mats.hair, 0.012, 0.212, 0.058);
      quiff.scale.set(0.06, 0.038, 0.044);
      quiff.rotation.set(-0.6, 0, 0.14);

      // Arms: shoulder -> elbow, white cuffs, hands
      const shoulders = [], elbows = [];
      for (const side of [1, -1]) {
        const shoulder = new THREE.Group();
        shoulder.position.set(0.212 * side, 0.465, 0);
        shoulder.rotation.z = 0.07 * side;
        torso.add(shoulder);
        add(shoulder, new THREE.SphereGeometry(0.066, 16, 12), mats.suit);
        limb(shoulder, 0.3, 0.056, mats.suit);
        const elbow = new THREE.Group();
        elbow.position.y = -0.3;
        shoulder.add(elbow);
        limb(elbow, 0.26, 0.048, mats.suit);
        add(elbow, new THREE.CylinderGeometry(0.041, 0.041, 0.024, 16), mats.shirt, 0, -0.262, 0);
        add(elbow, new THREE.SphereGeometry(0.044, 16, 12), mats.skin, 0, -0.31, 0.004).scale.set(0.78, 1.3, 0.55);
        shoulders.push(shoulder);
        elbows.push(elbow);
      }

      return { root, pelvis, torso, head, hips, knees, shoulders, elbows, gait: 0, walkAmt: 0, climbAmt: 0, lastX: START_X };
    }

    // Procedural gait: phase advances with distance travelled, so feet don't slide.
    function poseBusinessman(dt, t, moving, climbing) {
      const dx = Math.abs(character.position.x - rig.lastX);
      rig.lastX = character.position.x;
      rig.gait += (dx / 0.55) * Math.PI;
      rig.walkAmt += ((moving ? 1 : 0) - rig.walkAmt) * Math.min(1, dt * 8);
      rig.climbAmt += ((climbing ? 1 : 0) - rig.climbAmt) * Math.min(1, dt * 6);
      const w = rig.walkAmt, c = rig.climbAmt;
      for (let i = 0; i < 2; i++) {
        const ph = rig.gait + i * Math.PI;
        const s = Math.sin(ph), swing = Math.max(0, Math.cos(ph));
        rig.hips[i].rotation.x = -0.42 * s * w - 0.5 * c * w * Math.max(0, s);
        rig.knees[i].rotation.x = w * (0.06 + 0.72 * swing * (1 + 0.7 * c)) + 0.3 * c * w * Math.max(0, s);
        rig.shoulders[i].rotation.x = 0.34 * s * w;
        rig.elbows[i].rotation.x = -(0.14 + 0.25 * w * Math.max(0, -s)) - 0.04 * (1 - w) * Math.sin(t * 1.3);
      }
      rig.pelvis.position.y = HIP_Y + w * (0.016 * Math.cos(2 * rig.gait) - 0.012);
      rig.pelvis.rotation.y = 0.07 * Math.sin(rig.gait) * w;
      rig.torso.rotation.y = -0.1 * Math.sin(rig.gait) * w;
      rig.torso.rotation.x = 0.04 * w + 0.1 * c * w;
      rig.torso.scale.y = 1 + 0.006 * Math.sin(t * 2.2) * (1 - w); // idle breathing
      rig.head.rotation.x = -0.06 * c * w;
    }

    // ---------- Camera framing ----------
    const camDir = new THREE.Vector3(-0.42, 0.58, 1).normalize();
    const baseTarget = new THREE.Vector3(1.4, 1.35, 0);
    let baseDist = 10;

    function fitCamera() {
      const aspect = window.innerWidth / window.innerHeight;
      camera.fov = aspect < 0.8 ? 48 : aspect < 1.2 ? 42 : 35;
      camera.aspect = aspect;
      const vHalf = THREE.MathUtils.degToRad(camera.fov / 2);
      const hHalf = Math.atan(Math.tan(vHalf) * aspect);
      // Wide screens frame the full walk (x ≈ -3 … 6); portrait frames the stairs only.
      const portrait = aspect < 0.8;
      baseTarget.x = portrait ? 2.5 : 1.4;
      const needH = (portrait ? 3.3 : 4.9) / Math.tan(hHalf);
      const needV = 2.6 / Math.tan(vHalf);
      baseDist = Math.max(needH, needV, 8.5);
      scene.fog.near = baseDist * 1.2;
      scene.fog.far = baseDist * 3.2;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }
    fitCamera();
    window.addEventListener('resize', fitCamera);

    // ---------- Animation loop ----------
    const clock = new THREE.Clock(false);
    const progressSpans = document.querySelectorAll('#progress span');
    const finaleEl = document.getElementById('finale');
    let finaleShown = false;
    let rafId = 0;
    const tmpTarget = new THREE.Vector3();
    const tmpPos = new THREE.Vector3();
    const finalTarget = new THREE.Vector3();
    const finalPos = new THREE.Vector3();

    function start() {
      if (intro.fellBack) return;
      intro.playing = true;
      loaderEl.classList.add('hide');
      clock.start();
      rafId = requestAnimationFrame(tick);
    }

    function ease(t, kind) {
      if (kind === 'in') return t * t * (1.6 - 0.6 * t);
      if (kind === 'out') return 1 - (1 - t) * (1 - t) * (1.6 - 0.6 * (1 - t));
      return t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
    }

    function smooth(a, b, x) {
      const t = THREE.MathUtils.clamp((x - a) / (b - a), 0, 1);
      return t * t * (3 - 2 * t);
    }

    function lightStep(i) {
      const st = steps[i];
      if (st.lit) return;
      st.lit = true;
      progressSpans[i].classList.add('on');
    }

    function tick() {
      rafId = requestAnimationFrame(tick);
      const dt = Math.min(clock.getDelta(), 0.05);
      const t = clock.elapsedTime;

      // Character position along the timeline.
      let walking = false;
      let climbing = false;
      let pos = segments[0].from;
      let y = 0;
      for (const s of segments) {
        if (t < s.start) break;
        if (t <= s.end) {
          const k = (t - s.start) / s.dur;
          const e = ease(k, s.ease);
          const x = THREE.MathUtils.lerp(s.from.x, s.to.x, e);
          // Rise mostly while crossing the riser, with a small lift arc.
          y = s.climb
            ? s.from.y + (s.to.y - s.from.y) * smooth(0.28, 0.72, e) + 0.035 * Math.sin(Math.PI * e)
            : 0;
          pos = new THREE.Vector2(x, y);
          walking = true;
          climbing = s.climb;
          break;
        }
        pos = s.to;
        y = s.to.y;
        if (s.land >= 0) lightStep(s.land);
      }
      character.position.x = pos.x;
      character.position.y = walking ? y : pos.y;

      poseBusinessman(dt, t, walking, climbing);

      // Step glow easing.
      for (const st of steps) {
        const goal = st.lit ? 1 : 0;
        st.glow += (goal - st.glow) * Math.min(1, dt * 5);
        st.stripMat.emissiveIntensity = st.glow * 2.4;
        st.labelMat.emissiveIntensity = st.glow * 1.1;
      }

      // Camera: slow cinematic drift following the climber, then a push-in for the finale.
      const drift = Math.sin(t * 0.18) * 0.12;
      const dir = tmpPos.copy(camDir).applyAxisAngle(THREE.Object3D.DEFAULT_UP, drift - t * 0.012);
      tmpTarget.copy(baseTarget);
      tmpTarget.x = THREE.MathUtils.lerp(baseTarget.x, character.position.x, 0.22);
      tmpTarget.y = baseTarget.y + character.position.y * 0.2;
      const camPos = dir.multiplyScalar(baseDist).add(tmpTarget);

      if (t > CLIMB_END) {
        const f = smooth(0, FINALE_DUR, t - CLIMB_END);
        finalTarget.set(character.position.x - 0.6, character.position.y + 0.55, 0);
        finalPos.copy(camDir).applyAxisAngle(THREE.Object3D.DEFAULT_UP, 0.18).multiplyScalar(baseDist * 0.72).add(finalTarget);
        camPos.lerp(finalPos, f);
        tmpTarget.lerp(finalTarget, f);
        // Turn the character to face the camera.
        character.rotation.y = modelYaw - f * 1.35;
        if (!finaleShown && t - CLIMB_END > 0.5) {
          finaleShown = true;
          finaleEl.classList.add('show');
          document.getElementById('progress').style.opacity = '0';
        }
      }
      camera.position.copy(camPos);
      camera.lookAt(tmpTarget);

      renderer.render(scene, camera);

      if (t > EXIT_AFTER) intro.exit();
    }

    intro.cleanup = () => {
      cancelAnimationFrame(rafId);
      window.removeEventListener('resize', fitCamera);
      scene.traverse((o) => {
        if (o.geometry) o.geometry.dispose();
        if (o.material) {
          const mats = Array.isArray(o.material) ? o.material : [o.material];
          for (const m of mats) {
            for (const key of ['map', 'roughnessMap', 'emissiveMap', 'normalMap']) if (m[key]) m[key].dispose();
            m.dispose();
          }
        }
      });
      envRT.dispose();
      pmrem.dispose();
      renderer.dispose();
    };

    // ---------- Procedural textures ----------
    function makeGroundFadeTexture() {
      const c = document.createElement('canvas');
      c.width = c.height = 256;
      const g = c.getContext('2d');
      const grad = g.createRadialGradient(128, 128, 20, 128, 128, 128);
      grad.addColorStop(0, '#ffffff');
      grad.addColorStop(0.45, '#ffffff');
      grad.addColorStop(1, '#000000');
      g.fillStyle = grad;
      g.fillRect(0, 0, 256, 256);
      return new THREE.CanvasTexture(c);
    }

    function makeRadialTexture() {
      const c = document.createElement('canvas');
      c.width = c.height = 256;
      const g = c.getContext('2d');
      const grad = g.createRadialGradient(128, 128, 30, 128, 128, 128);
      grad.addColorStop(0, 'rgba(20,32,64,0.55)');
      grad.addColorStop(1, 'rgba(20,32,64,0)');
      g.fillStyle = grad;
      g.fillRect(0, 0, 256, 256);
      return new THREE.CanvasTexture(c);
    }

    function makeConcreteTextures() {
      const size = 512;
      const col = document.createElement('canvas');
      const rough = document.createElement('canvas');
      col.width = col.height = rough.width = rough.height = size;
      const gc = col.getContext('2d');
      const gr = rough.getContext('2d');
      gc.fillStyle = '#eef1f7';
      gc.fillRect(0, 0, size, size);
      gr.fillStyle = '#9a9a9a';
      gr.fillRect(0, 0, size, size);
      // Soft blotches
      for (let i = 0; i < 70; i++) {
        const x = Math.random() * size, y = Math.random() * size, r = 20 + Math.random() * 70;
        const a = 0.025 + Math.random() * 0.04;
        const grad = gc.createRadialGradient(x, y, 0, x, y, r);
        const shade = Math.random() < 0.5 ? '120,130,150' : '255,255,255';
        grad.addColorStop(0, `rgba(${shade},${a})`);
        grad.addColorStop(1, `rgba(${shade},0)`);
        gc.fillStyle = grad;
        gc.fillRect(x - r, y - r, r * 2, r * 2);
        const gg = gr.createRadialGradient(x, y, 0, x, y, r);
        const v = Math.random() < 0.5 ? 70 : 200;
        gg.addColorStop(0, `rgba(${v},${v},${v},0.25)`);
        gg.addColorStop(1, `rgba(${v},${v},${v},0)`);
        gr.fillStyle = gg;
        gr.fillRect(x - r, y - r, r * 2, r * 2);
      }
      // Fine aggregate speckle
      for (let i = 0; i < 9000; i++) {
        const x = Math.random() * size, y = Math.random() * size;
        const v = Math.random() < 0.5 ? 0 : 255;
        gc.fillStyle = `rgba(${v ? '255,255,255' : '90,100,120'},${0.05 + Math.random() * 0.08})`;
        gc.fillRect(x, y, 1 + Math.random() * 1.5, 1 + Math.random() * 1.5);
        gr.fillStyle = `rgba(${v},${v},${v},0.15)`;
        gr.fillRect(x, y, 1.5, 1.5);
      }
      const color = new THREE.CanvasTexture(col);
      color.colorSpace = THREE.SRGBColorSpace;
      color.anisotropy = 4;
      const roughT = new THREE.CanvasTexture(rough);
      return { color, rough: roughT };
    }

    function makeLabelTexture(text) {
      const c = document.createElement('canvas');
      c.width = 512; c.height = 160;
      const tex = new THREE.CanvasTexture(c);
      tex.colorSpace = THREE.SRGBColorSpace;
      tex.anisotropy = 8;
      labelCanvases.push({ c, tex, text });
      drawLabel(c, text);
      return tex;
    }

    function drawLabel(c, text) {
      const g = c.getContext('2d');
      g.clearRect(0, 0, c.width, c.height);
      g.fillStyle = '#ffffff';
      g.textAlign = 'center';
      g.textBaseline = 'middle';
      g.font = "800 104px Inter, 'Segoe UI', Arial, sans-serif";
      if ('letterSpacing' in g) g.letterSpacing = '6px';
      g.fillText(text, c.width / 2, c.height / 2 + 4);
    }

    function refreshLabelTextures() {
      for (const l of labelCanvases) {
        drawLabel(l.c, l.text);
        l.tex.needsUpdate = true;
      }
    }
  </script>
</body>
