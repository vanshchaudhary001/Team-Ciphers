<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StartSmart — Welcome</title>
  <meta name="description" content="StartSmart intro: step through the door into your new workplace.">
  <meta name="theme-color" content="#0F1B2D">
  <link rel="icon" type="image/png" href="start-smart-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@600;700&display=swap" rel="stylesheet">

  <script>
    // Return to the page that triggered the intro, telling it not to redirect again.
    function goHome() {
      var to = '/';
      try {
        var saved = sessionStorage.getItem('startsmart_intro_return');
        if (saved && saved.charAt(0) === '/' && saved.charAt(1) !== '/') to = saved;
        sessionStorage.removeItem('startsmart_intro_return');
        sessionStorage.setItem('startsmart_intro_done', '1');
      } catch (e) { }
      window.location.replace(to);
    }

    window.__intro = {
      skipped: false,
      playing: false,
      exited: false,
      cleanup: null,
      exit: function () {
        if (this.exited) return;
        this.exited = true;
        try { if (this.cleanup) this.cleanup(); } catch (e) { }
        goHome();
      }
    };

    // Gate: reduced motion skips; otherwise play only on the first visit unless forced with ?intro=1.
    (function () {
      var intro = window.__intro;
      try {
        if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
          intro.skipped = true;
        } else {
          var force = /[?&]intro=1(&|#|$)/.test(window.location.search) ||
            /[?&]intro=1(&|#|$)/.test(sessionStorage.getItem('startsmart_intro_return') || '');
          var seen = false;
          try { seen = localStorage.getItem('startsmart_intro_seen') === '1'; } catch (e) { }
          if (seen && !force) intro.skipped = true;
        }
      } catch (e) { }
      if (intro.skipped) {
        intro.exited = true;
        goHome();
      }
    })();
  </script>

  <style>
    :root {
      --ink: #0F1B2D;
      --ivory: #FAF7F2;
      --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: var(--ink);
    }

    #scene {
      position: fixed;
      inset: 0;
      display: block;
      width: 100%;
      height: 100%;
    }

    /* Opening fade (near-black ink) and closing fill (warm cream). */
    .veil {
      position: fixed;
      inset: 0;
      pointer-events: none;
    }

    #fadeIn {
      z-index: 3;
      background: #0A1322;
      opacity: 1;
      transition: opacity 0.6s ease-out;
    }

    #fadeIn.gone { opacity: 0; }

    #cream {
      z-index: 4;
      background: var(--ivory);
      opacity: 0;
    }

    #homeFrame {
      position: fixed;
      inset: 0;
      z-index: 5;
      width: 100%;
      height: 100%;
      border: 0;
      opacity: 0;
      pointer-events: none;
      background: var(--ivory);
      transition: opacity 0.6s ease-in-out;
    }

    #homeFrame.show { opacity: 1; }

    .skip-btn {
      position: fixed;
      right: 20px;
      bottom: 20px;
      z-index: 10;
      padding: 8px 14px;
      border-radius: 999px;
      border: 1px solid rgba(250, 247, 242, 0.28);
      background: rgba(250, 247, 242, 0.08);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      color: var(--ivory);
      font: 600 0.8rem var(--font-sans);
      letter-spacing: 0.02em;
      cursor: pointer;
      opacity: 0;
      transition: opacity 0.4s ease, background 0.2s ease, border-color 0.2s ease;
    }

    .skip-btn.show { opacity: 0.9; }
    .skip-btn:hover { background: rgba(250, 247, 242, 0.16); border-color: rgba(250, 247, 242, 0.5); }
    .skip-btn:focus-visible { outline: 2px solid #C2773A; outline-offset: 3px; }

    @media (max-width: 600px) {
      .skip-btn { right: 16px; bottom: 16px; }
    }
  </style>

  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"
      }
    }
  </script>
</head>

<body>
  <canvas id="scene" aria-hidden="true"></canvas>
  <div class="veil" id="fadeIn"></div>
  <div class="veil" id="cream"></div>
  <button class="skip-btn" id="skipBtn" type="button">Skip intro</button>

  <script>
    document.getElementById('skipBtn').addEventListener('click', function () { window.__intro.exit(); });
    // If the 3D scene errors or hasn't started within 2.5s (slow CDN, no WebGL), go straight home.
    window.addEventListener('error', function () { if (!window.__intro.playing) window.__intro.exit(); });
    setTimeout(function () { if (!window.__intro.playing) window.__intro.exit(); }, 2500);
  </script>

  <script type="module">
    import * as THREE from 'three';
    import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
    import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';
    import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
    import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
    import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
    import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
    import { Reflector } from 'three/addons/objects/Reflector.js';

    const intro = window.__intro;
    if (!intro.exited) main();

    function main() {
      // ---------- Constants ----------
      const INK = 0x0F1B2D;
      const WARM = new THREE.Color(0xFFE8CC);
      const IVORY = 0xFAF7F2;
      const TEAL = 0x0F766E;
      const COPPER = 0xC2773A;

      const OPEN_W = 1.04;     // door opening (inside the frame)
      const OPEN_H = 2.36;     // ≈ 1.3 × the figure's height
      const DOOR_W = 1.0;      // panel leaves ~2cm side gaps for the light leaks
      const DOOR_H = 2.33;
      const DOOR_Z = -4.2;
      const HINGE_X = -OPEN_W / 2 + 0.02;

      const START_X = 0.22, START_Z = 0;     // right shoulder lines up with the handle
      const STOP_Z = -3.76;                  // arm's reach from the handle
      const END_X = 0.08, END_Z = -6.0;      // through the doorway into the light
      const STRIDE = 0.62;                   // metres per step; gait phase follows distance, so feet don't slide

      const T = { walkStart: 0.6, walkEnd: 2.4, openStart: 2.9, openEnd: 3.9, throughEnd: 4.9, homeEnd: 5.5 };

      const isTouch = window.matchMedia('(hover: none), (pointer: coarse)').matches;
      const isMobile = isTouch || Math.min(window.innerWidth, window.innerHeight) < 700;

      // ---------- Renderer ----------
      let renderer;
      try {
        renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('scene'), antialias: true, powerPreference: 'high-performance' });
      } catch (e) {
        intro.exit();
        return;
      }
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      renderer.setPixelRatio(dpr);
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.outputColorSpace = THREE.SRGBColorSpace;
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = 1.0;
      renderer.shadowMap.enabled = true;
      renderer.shadowMap.type = THREE.PCFSoftShadowMap;

      const scene = new THREE.Scene();
      scene.background = new THREE.Color(INK);
      scene.fog = new THREE.FogExp2(INK, 0.075);

      const pmrem = new THREE.PMREMGenerator(renderer);
      const envRT = pmrem.fromScene(new RoomEnvironment(), 0.04);
      scene.environment = envRT.texture;
      scene.environmentIntensity = 0.22;

      const camera = new THREE.PerspectiveCamera(40, window.innerWidth / window.innerHeight, 0.05, 80);
      camera.layers.enable(1); // layer 1 = door light (kept out of the floor reflection)

      // ---------- Lighting ----------
      scene.add(new THREE.HemisphereLight(0x9fb4d8, 0x0b1422, 0.35));

      const key = new THREE.DirectionalLight(0xdfe8ff, 1.3);
      key.position.set(-3.5, 5, 4.5);
      key.target.position.set(0, 0.8, -2);
      key.castShadow = true;
      key.shadow.mapSize.set(isMobile ? 1024 : 2048, isMobile ? 1024 : 2048);
      Object.assign(key.shadow.camera, { left: -5, right: 5, top: 5, bottom: -5, near: 1, far: 25 });
      key.shadow.bias = -0.0004;
      key.shadow.normalBias = 0.02;
      scene.add(key, key.target);

      // Teal rim from behind: a narrow spot that travels with the figure, so it outlines him
      // without throwing a big specular glare off the glossy floor.
      const rim = new THREE.SpotLight(0x5eead4, 14, 4.4, 0.3, 0.7, 1.4);
      const RIM_OFFSET = new THREE.Vector3(-0.7, 3.0, -2.4);
      scene.add(rim, rim.target);

      // Warm light behind the door: blocked by the closed panel, floods through as it opens.
      const doorLight = new THREE.SpotLight(WARM, 0, 18, 0.62, 0.9, 1.6);
      doorLight.position.set(0, 2.25, DOOR_Z - 2.0);
      doorLight.target.position.set(0, 0, 1.0);
      doorLight.castShadow = true;
      doorLight.shadow.mapSize.set(1024, 1024);
      doorLight.shadow.bias = -0.0005;
      doorLight.shadow.normalBias = 0.02;
      scene.add(doorLight, doorLight.target);

      // ---------- Floor: dark glossy navy with a faint reflection ----------
      let reflector = null;
      if (!isMobile) {
        reflector = new Reflector(new THREE.PlaneGeometry(60, 60), {
          clipBias: 0.003,
          textureWidth: Math.round(window.innerWidth * dpr * 0.5),
          textureHeight: Math.round(window.innerHeight * dpr * 0.5),
          color: 0x8a94a6,
        });
        reflector.rotation.x = -Math.PI / 2;
        scene.add(reflector);
      }
      const floor = new THREE.Mesh(
        new THREE.PlaneGeometry(60, 60),
        new THREE.MeshPhysicalMaterial({
          color: 0x101c30, roughness: 0.32, metalness: 0.1, clearcoat: 0.6, clearcoatRoughness: 0.25,
          transparent: !!reflector, opacity: reflector ? 0.86 : 1,
        })
      );
      floor.rotation.x = -Math.PI / 2;
      floor.position.y = 0.002;
      floor.receiveShadow = true;
      scene.add(floor);

      // Soft contact shadow that follows the figure.
      const contact = new THREE.Mesh(
        new THREE.PlaneGeometry(0.95, 0.95),
        new THREE.MeshBasicMaterial({ map: radialTexture('rgba(3,7,14,0.85)', 'rgba(3,7,14,0)'), transparent: true, depthWrite: false })
      );
      contact.rotation.x = -Math.PI / 2;
      contact.position.y = 0.004;
      scene.add(contact);

      // Warm spill on the floor in front of the door (a thin leak at first, a wash once open).
      const spill = new THREE.Mesh(
        new THREE.PlaneGeometry(1.5, 1),
        new THREE.MeshBasicMaterial({ map: spillTexture(), color: WARM, transparent: true, opacity: 0.2, blending: THREE.AdditiveBlending, depthWrite: false })
      );
      spill.rotation.x = -Math.PI / 2;
      spill.position.set(0, 0.006, DOOR_Z + 0.5);
      scene.add(spill);

      // ---------- Door ----------
      const doorRoot = new THREE.Group();
      doorRoot.position.z = DOOR_Z;
      scene.add(doorRoot);

      const ivoryMat = new THREE.MeshPhysicalMaterial({ color: IVORY, roughness: 0.45, clearcoat: 0.3, clearcoatRoughness: 0.4 });
      const tealMat = new THREE.MeshPhysicalMaterial({ color: TEAL, roughness: 0.4, clearcoat: 0.5, clearcoatRoughness: 0.3 });
      const tealDeepMat = new THREE.MeshPhysicalMaterial({ color: 0x0b625b, roughness: 0.42, clearcoat: 0.5, clearcoatRoughness: 0.3 });
      const copperMat = new THREE.MeshStandardMaterial({ color: COPPER, metalness: 0.9, roughness: 0.25 });

      const box = (parent, w, h, d, r, mat, x, y, z) => {
        const m = new THREE.Mesh(new RoundedBoxGeometry(w, h, d, 3, r), mat);
        m.position.set(x, y, z);
        m.castShadow = true;
        m.receiveShadow = true;
        parent.add(m);
        return m;
      };

      // Slim ivory frame
      const FW = 0.07, FD = 0.2;
      box(doorRoot, FW, OPEN_H + FW, FD, 0.02, ivoryMat, -(OPEN_W / 2 + FW / 2), (OPEN_H + FW) / 2, 0);
      box(doorRoot, FW, OPEN_H + FW, FD, 0.02, ivoryMat, OPEN_W / 2 + FW / 2, (OPEN_H + FW) / 2, 0);
      box(doorRoot, OPEN_W + FW * 2, FW, FD, 0.02, ivoryMat, 0, OPEN_H + FW / 2, 0);

      // Teal panel on a hinge (left edge); stiles + rails around two recessed panels
      const hinge = new THREE.Group();
      hinge.position.set(HINGE_X, 0.018, 0);
      doorRoot.add(hinge);
      const ST = 0.14, PT = 0.05, LOCK_Y = 0.98;
      const innerW = DOOR_W - ST * 2;
      box(hinge, ST, DOOR_H, PT, 0.006, tealMat, ST / 2, DOOR_H / 2, 0);
      box(hinge, ST, DOOR_H, PT, 0.006, tealMat, DOOR_W - ST / 2, DOOR_H / 2, 0);
      box(hinge, innerW + 0.01, 0.16, PT, 0.006, tealMat, DOOR_W / 2, DOOR_H - 0.08, 0);
      box(hinge, innerW + 0.01, 0.14, PT, 0.006, tealMat, DOOR_W / 2, LOCK_Y, 0);
      box(hinge, innerW + 0.01, 0.24, PT, 0.006, tealMat, DOOR_W / 2, 0.12, 0);
      const upperH = (DOOR_H - 0.16) - (LOCK_Y + 0.07);
      const lowerH = (LOCK_Y - 0.07) - 0.24;
      box(hinge, innerW + 0.01, upperH, 0.026, 0.008, tealDeepMat, DOOR_W / 2, LOCK_Y + 0.07 + upperH / 2, -0.006);
      box(hinge, innerW + 0.01, lowerH, 0.026, 0.008, tealDeepMat, DOOR_W / 2, 0.24 + lowerH / 2, -0.006);

      // Copper lever handle at hand height, on the free edge
      const HX = DOOR_W - 0.085;
      const rose = new THREE.Mesh(new THREE.CylinderGeometry(0.03, 0.03, 0.012, 28), copperMat);
      rose.rotation.x = Math.PI / 2;
      rose.position.set(HX, LOCK_Y, PT / 2 + 0.006);
      rose.castShadow = true;
      hinge.add(rose);
      const lever = new THREE.Group();
      lever.position.set(HX, LOCK_Y, PT / 2 + 0.045);
      hinge.add(lever);
      const neck = new THREE.Mesh(new THREE.CylinderGeometry(0.011, 0.011, 0.04, 16), copperMat);
      neck.rotation.x = Math.PI / 2;
      neck.position.z = -0.02;
      lever.add(neck);
      box(lever, 0.15, 0.022, 0.022, 0.009, copperMat, -0.065, 0, 0);

      // Copper "StartSmart" plate on the upper panel
      const plate = box(hinge, 0.3, 0.075, 0.008, 0.003, copperMat, DOOR_W / 2, 1.66, 0.017);
      const plateText = new THREE.Mesh(
        new THREE.PlaneGeometry(0.27, 0.06),
        new THREE.MeshStandardMaterial({ map: plateTexture(), transparent: true, metalness: 0.6, roughness: 0.5, polygonOffset: true, polygonOffsetFactor: -2 })
      );
      plateText.position.set(DOOR_W / 2, 1.66, 0.0215);
      hinge.add(plateText);

      // Thin lines of warm light leaking through the gaps around the closed door.
      const leakMat = new THREE.MeshBasicMaterial({ color: WARM.clone().multiplyScalar(3), transparent: true, fog: false, depthWrite: false });
      const leaks = new THREE.Group();
      leaks.position.z = DOOR_Z + 0.004;
      doorRoot.parent.add(leaks);
      const leakStrip = (w, h, x, y) => {
        const m = new THREE.Mesh(new THREE.PlaneGeometry(w, h), leakMat);
        m.position.set(x, y, 0);
        leaks.add(m);
      };
      const GAP = 0.012;
      leakStrip(GAP, OPEN_H, -OPEN_W / 2 + 0.01, OPEN_H / 2);
      leakStrip(GAP, OPEN_H, OPEN_W / 2 - 0.01, OPEN_H / 2);
      leakStrip(OPEN_W, GAP * 0.7, 0, OPEN_H - 0.006);
      leakStrip(OPEN_W, GAP, 0, 0.011);

      // ---------- The warm room beyond (stencil-masked to the doorway, layer 1) ----------
      const mask = new THREE.Mesh(
        new THREE.PlaneGeometry(OPEN_W, OPEN_H),
        new THREE.MeshBasicMaterial({
          colorWrite: false, depthWrite: false, side: THREE.DoubleSide,
          stencilWrite: true, stencilRef: 1, stencilFunc: THREE.AlwaysStencilFunc, stencilZPass: THREE.ReplaceStencilOp,
        })
      );
      mask.position.set(0, OPEN_H / 2, DOOR_Z + FD / 2);
      mask.renderOrder = -1;
      mask.layers.set(1);
      scene.add(mask);

      const glowMat = new THREE.MeshBasicMaterial({
        color: WARM.clone().multiplyScalar(2.4), fog: false,
        stencilWrite: true, stencilRef: 1, stencilFunc: THREE.EqualStencilFunc,
      });
      const glowWall = new THREE.Mesh(new THREE.PlaneGeometry(16, 10), glowMat);
      glowWall.position.set(0, 4, DOOR_Z - 3.0);
      glowWall.renderOrder = 1;
      glowWall.layers.set(1);
      scene.add(glowWall);

      // Warm floor inside the room, so the doorway reads as a lit space rather than a flat card.
      const roomFloor = new THREE.Mesh(
        new THREE.PlaneGeometry(16, 3.0),
        new THREE.MeshBasicMaterial({
          color: WARM.clone().multiplyScalar(0.25), fog: false,
          stencilWrite: true, stencilRef: 1, stencilFunc: THREE.EqualStencilFunc,
        })
      );
      roomFloor.rotation.x = -Math.PI / 2;
      roomFloor.position.set(0, 0.004, DOOR_Z - 1.5);
      roomFloor.renderOrder = 1;
      roomFloor.layers.set(1);
      scene.add(roomFloor);

      // ---------- Character (procedural; no model file) ----------
      const HIP_Y = 0.94;
      const rig = buildBusinessman();
      const character = rig.root;
      character.rotation.y = Math.PI; // built facing +Z; walk toward the door (-Z)
      character.position.set(START_X, 0, START_Z);
      scene.add(character);
      const RIGHT = 1; // arm index 1 is the figure's right arm once turned to face -Z

      function buildBusinessman() {
        const mats = {
          suit: new THREE.MeshPhysicalMaterial({ color: 0x1b2847, roughness: 0.74, sheen: 0.7, sheenRoughness: 0.75, sheenColor: 0x5d73a3 }),
          shirt: new THREE.MeshStandardMaterial({ color: 0xf3f5f9, roughness: 0.6 }),
          tie: new THREE.MeshPhysicalMaterial({ color: 0x0f766e, roughness: 0.4, sheen: 0.5, sheenColor: 0x5eead4 }),
          copper: new THREE.MeshStandardMaterial({ color: 0xb87333, metalness: 0.85, roughness: 0.32 }),
          skin: new THREE.MeshPhysicalMaterial({ color: 0xd8a888, roughness: 0.52, sheen: 0.25, sheenColor: 0xffd9c4 }),
          hair: new THREE.MeshPhysicalMaterial({ color: 0x2b1d14, roughness: 0.62, sheen: 0.7, sheenRoughness: 0.45, sheenColor: 0x7a5538, side: THREE.DoubleSide }),
          shoe: new THREE.MeshPhysicalMaterial({ color: 0x0e0f13, roughness: 0.28, clearcoat: 1, clearcoatRoughness: 0.15 }),
        };
        const add = (parent, geo, mat, x = 0, y = 0, z = 0) => {
          const m = new THREE.Mesh(geo, mat);
          m.position.set(x, y, z);
          m.castShadow = true;
          m.receiveShadow = true;
          parent.add(m);
          return m;
        };
        const limb = (parent, len, r, mat) => add(parent, new THREE.CapsuleGeometry(r, Math.max(0.01, len - r), 6, 16), mat, 0, -len / 2, 0);

        const root = new THREE.Group();
        const pelvis = new THREE.Group();
        pelvis.position.y = HIP_Y;
        root.add(pelvis);
        add(pelvis, new THREE.SphereGeometry(1, 24, 16), mats.suit).scale.set(0.175, 0.11, 0.115);

        // Legs: hip -> knee -> ankle
        const hips = [], knees = [];
        for (const side of [1, -1]) {
          const hip = new THREE.Group();
          hip.position.set(0.092 * side, -0.02, 0);
          pelvis.add(hip);
          limb(hip, 0.45, 0.074, mats.suit);
          const knee = new THREE.Group();
          knee.position.y = -0.45;
          hip.add(knee);
          limb(knee, 0.43, 0.062, mats.suit);
          const ankle = new THREE.Group();
          ankle.position.y = -0.43;
          knee.add(ankle);
          add(ankle, new RoundedBoxGeometry(0.1, 0.07, 0.27, 3, 0.03), mats.shoe, 0, -0.03, 0.055);
          hips.push(hip);
          knees.push(knee);
        }

        // Torso: tailored jacket (lathe profile, flattened front-to-back)
        const torso = new THREE.Group();
        torso.position.y = 0.02;
        pelvis.add(torso);
        const profile = [[0.001, -0.15], [0.168, -0.15], [0.172, -0.06], [0.158, 0.1], [0.175, 0.3], [0.198, 0.42], [0.175, 0.5], [0.09, 0.545], [0.001, 0.55]]
          .map(([r, y]) => new THREE.Vector2(r, y));
        add(torso, new THREE.LatheGeometry(profile, 40), mats.suit).scale.z = 0.62;

        // Shirt V, tie, buttons, pocket square
        const front = (y) => 0.62 * (y > 0.3 ? 0.175 + (y - 0.3) * 0.19 : 0.158 + Math.max(0, y - 0.1) * 0.085) + 0.004;
        const vShape = new THREE.Shape([new THREE.Vector2(-0.062, 0), new THREE.Vector2(0.062, 0), new THREE.Vector2(0, -0.2)]);
        const shirtV = add(torso, new THREE.ShapeGeometry(vShape), mats.shirt, 0, 0.53, front(0.45));
        shirtV.rotation.x = -0.12;
        const tieShape = new THREE.Shape([new THREE.Vector2(-0.016, 0), new THREE.Vector2(0.016, 0), new THREE.Vector2(0.026, -0.17), new THREE.Vector2(0, -0.2), new THREE.Vector2(-0.026, -0.17)]);
        const tie = add(torso, new THREE.ShapeGeometry(tieShape), mats.tie, 0, 0.515, front(0.45) + 0.004);
        tie.rotation.x = -0.12;
        add(torso, new THREE.SphereGeometry(0.009, 10, 8), mats.copper, 0, 0.2, front(0.2) - 0.001);
        add(torso, new THREE.SphereGeometry(0.009, 10, 8), mats.copper, 0, 0.11, front(0.11) - 0.002);
        const pocket = add(torso, new THREE.BoxGeometry(0.05, 0.016, 0.01), mats.copper, 0.095, 0.37, front(0.37) - 0.012);
        pocket.rotation.x = -0.1;

        // Collar + neck + head
        const collar = add(torso, new THREE.TorusGeometry(0.052, 0.016, 10, 24), mats.shirt, 0, 0.545, 0);
        collar.rotation.x = Math.PI / 2;
        add(torso, new THREE.CylinderGeometry(0.046, 0.05, 0.11, 16), mats.skin, 0, 0.59, 0);
        const head = new THREE.Group();
        head.position.y = 0.64;
        torso.add(head);
        add(head, new THREE.SphereGeometry(0.1, 32, 24), mats.skin, 0, 0.115, 0.005).scale.set(0.9, 1.17, 1.0);
        // Hair: short tapered sides, fuller top with a side part, swept-up front quiff.
        // A tilted cap around the skull puts the hairline high at the front and low at the nape.
        const hairSides = add(head, new THREE.SphereGeometry(1, 40, 20, 0, Math.PI * 2, 0, Math.PI * 0.47), mats.hair, 0, 0.115, 0.005);
        hairSides.scale.set(0.1, 0.127, 0.122);
        hairSides.rotation.x = -0.55;
        const hairTop = add(head, new THREE.SphereGeometry(1, 32, 20), mats.hair, 0.008, 0.205, 0.004);
        hairTop.scale.set(0.072, 0.05, 0.1);
        hairTop.rotation.set(-0.15, 0, 0.1);
        const quiff = add(head, new THREE.SphereGeometry(1, 28, 16), mats.hair, 0.012, 0.212, 0.058);
        quiff.scale.set(0.06, 0.038, 0.044);
        quiff.rotation.set(-0.6, 0, 0.14);

        // Arms: shoulder -> elbow, white cuffs, hands
        const shoulders = [], elbows = [];
        for (const side of [1, -1]) {
          const shoulder = new THREE.Group();
          shoulder.position.set(0.212 * side, 0.465, 0);
          shoulder.rotation.z = 0.07 * side;
          torso.add(shoulder);
          add(shoulder, new THREE.SphereGeometry(0.066, 16, 12), mats.suit);
          limb(shoulder, 0.3, 0.056, mats.suit);
          const elbow = new THREE.Group();
          elbow.position.y = -0.3;
          shoulder.add(elbow);
          limb(elbow, 0.26, 0.048, mats.suit);
          add(elbow, new THREE.CylinderGeometry(0.041, 0.041, 0.024, 16), mats.shirt, 0, -0.262, 0);
          add(elbow, new THREE.SphereGeometry(0.044, 16, 12), mats.skin, 0, -0.31, 0.004).scale.set(0.78, 1.3, 0.55);
          shoulders.push(shoulder);
          elbows.push(elbow);
        }

        return { root, pelvis, torso, head, hips, knees, shoulders, elbows, gait: 0, walkAmt: 0, pushDown: 0, lastX: START_X, lastZ: START_Z };
      }

      // Procedural gait + handle press. Gait phase follows distance travelled.
      function poseBusinessman(dt, t, moving, press) {
        const dx = character.position.x - rig.lastX, dz = character.position.z - rig.lastZ;
        rig.lastX = character.position.x;
        rig.lastZ = character.position.z;
        rig.gait += (Math.hypot(dx, dz) / STRIDE) * Math.PI;
        rig.walkAmt += ((moving ? 1 : 0) - rig.walkAmt) * Math.min(1, dt / 0.3 * 2.3); // ≈0.3s blend
        const w = rig.walkAmt;
        for (let i = 0; i < 2; i++) {
          const ph = rig.gait + i * Math.PI;
          const s = Math.sin(ph), swing = Math.max(0, Math.cos(ph));
          rig.hips[i].rotation.x = -0.42 * s * w;
          rig.knees[i].rotation.x = w * (0.06 + 0.72 * swing);
          rig.shoulders[i].rotation.x = 0.34 * s * w;
          rig.elbows[i].rotation.x = -(0.14 + 0.25 * w * Math.max(0, -s)) - 0.04 * (1 - w) * Math.sin(t * 1.3);
        }
        // Right hand reaches forward-down to the lever (two-bone pose solved for this reach).
        if (press > 0) {
          const sh = rig.shoulders[RIGHT], el = rig.elbows[RIGHT];
          sh.rotation.x = THREE.MathUtils.lerp(sh.rotation.x, -0.36 + 0.05 * rig.pushDown, press);
          el.rotation.x = THREE.MathUtils.lerp(el.rotation.x, -0.73, press);
        }
        rig.pelvis.position.y = HIP_Y + w * (0.016 * Math.cos(2 * rig.gait) - 0.012);
        rig.pelvis.rotation.y = 0.07 * Math.sin(rig.gait) * w;
        rig.torso.rotation.y = -0.1 * Math.sin(rig.gait) * w;
        rig.torso.rotation.x = 0.04 * w + 0.05 * press;
        rig.torso.scale.y = 1 + 0.006 * Math.sin(t * 2.2) * (1 - w); // idle breathing
      }

      // ---------- Post-processing: subtle bloom on the door light only (HDR threshold) ----------
      const rt = new THREE.WebGLRenderTarget(window.innerWidth * dpr, window.innerHeight * dpr, { type: THREE.HalfFloatType, stencilBuffer: true });
      const composer = new EffectComposer(renderer, rt);
      composer.setPixelRatio(dpr);
      composer.setSize(window.innerWidth, window.innerHeight);
      composer.addPass(new RenderPass(scene, camera));
      const BLOOM = isMobile ? 0.2 : 0.4;
      const bloom = new UnrealBloomPass(new THREE.Vector2(window.innerWidth / 2, window.innerHeight / 2), BLOOM, 0.55, 0.95);
      composer.addPass(bloom);
      composer.addPass(new OutputPass());

      // ---------- Camera ----------
      let portrait = false;
      const CAM = { a: new THREE.Vector3(), b: new THREE.Vector3(), c: new THREE.Vector3() };
      function fit() {
        const aspect = window.innerWidth / window.innerHeight;
        portrait = aspect < 0.8;
        camera.aspect = aspect;
        camera.fov = portrait ? 52 : 40;
        camera.updateProjectionMatrix();
        // Offsets from the figure: behind (+Z), slightly right and above, easing in as he walks.
        if (portrait) {
          CAM.a.set(0.9, 2.7, 4.6); CAM.b.set(0.7, 2.5, 3.8); CAM.c.set(0.15, 1.8, 1.5);
        } else {
          CAM.a.set(1.35, 2.25, 4.3); CAM.b.set(1.0, 2.05, 3.5); CAM.c.set(0.2, 1.65, 1.5);
        }
        renderer.setSize(window.innerWidth, window.innerHeight);
        composer.setSize(window.innerWidth, window.innerHeight);
      }
      fit();
      window.addEventListener('resize', fit);

      // Mouse parallax (1–2°) before he starts walking; off on touch devices.
      const mouse = { x: 0, y: 0, sx: 0, sy: 0 };
      function onMouse(e) {
        mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
        mouse.y = (e.clientY / window.innerHeight) * 2 - 1;
      }
      if (!isTouch) window.addEventListener('mousemove', onMouse);

      // ---------- Timeline ----------
      const clamp01 = (x) => Math.min(1, Math.max(0, x));
      const smooth = (a, b, x) => { const k = clamp01((x - a) / (b - a)); return k * k * (3 - 2 * k); };
      const inOutSine = (k) => -(Math.cos(Math.PI * k) - 1) / 2;
      const inOutCubic = (k) => (k < 0.5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2);
      const inSine = (k) => 1 - Math.cos((k * Math.PI) / 2);

      const fadeEl = document.getElementById('fadeIn');
      const creamEl = document.getElementById('cream');
      const skipEl = document.getElementById('skipBtn');
      const clock = new THREE.Clock(false);
      const camPos = new THREE.Vector3(), camOff = new THREE.Vector3(), look = new THREE.Vector3();
      let rafId = 0, frame = null, frameReady = false, frameShown = false;

      function start() {
        if (intro.exited) return;
        intro.playing = true;
        try { localStorage.setItem('startsmart_intro_seen', '1'); } catch (e) { }
        fadeEl.classList.add('gone');
        skipEl.classList.add('show');
        clock.start();
        rafId = requestAnimationFrame(tick);
      }

      function preloadHome() {
        let to = '/';
        try {
          const saved = sessionStorage.getItem('startsmart_intro_return');
          if (saved && saved[0] === '/' && saved[1] !== '/') to = saved;
        } catch (e) { }
        const hashAt = to.indexOf('#');
        const base = hashAt >= 0 ? to.slice(0, hashAt) : to;
        const hash = hashAt >= 0 ? to.slice(hashAt) : '';
        frame = document.createElement('iframe');
        frame.id = 'homeFrame';
        frame.setAttribute('aria-hidden', 'true');
        frame.tabIndex = -1;
        frame.onload = () => { frameReady = true; };
        frame.src = base + (base.includes('?') ? '&' : '?') + 'nointro' + hash;
        document.body.appendChild(frame);
      }

      function tick() {
        rafId = requestAnimationFrame(tick);
        const dt = Math.min(clock.getDelta(), 0.05);
        const t = clock.elapsedTime;

        // Position along the path
        let x = START_X, z = START_Z, moving = false;
        if (t >= T.walkStart && t < T.walkEnd) {
          const e = inOutSine((t - T.walkStart) / (T.walkEnd - T.walkStart));
          z = THREE.MathUtils.lerp(START_Z, STOP_Z, e);
          moving = true;
        } else if (t >= T.walkEnd && t < T.openEnd) {
          z = STOP_Z;
        } else if (t >= T.openEnd) {
          const e = inSine(clamp01((t - T.openEnd) / (T.throughEnd - T.openEnd)));
          x = THREE.MathUtils.lerp(START_X, END_X, e);
          z = THREE.MathUtils.lerp(STOP_Z, END_Z, e);
          moving = t < T.throughEnd + 0.3;
        }
        character.position.set(x, 0, z);
        contact.position.set(x, 0.004, z + 0.02);
        rim.position.set(x, 0, z).add(RIM_OFFSET);
        rim.target.position.set(x, 1.55, z);
        rim.intensity = 14 * (1 - smooth(T.openStart, T.openEnd, t) * 0.6);

        // Handle press, then the door swings inward on its hinge
        const press = smooth(2.45, 2.75, t) * (1 - smooth(3.05, 3.45, t));
        rig.pushDown = smooth(2.6, 2.85, t);
        lever.rotation.z = 0.52 * smooth(2.6, 2.85, t) * (1 - smooth(3.3, 3.6, t)); // ≈30° down
        const open = inOutCubic(clamp01((t - T.openStart) / (T.openEnd - T.openStart)));
        hinge.rotation.y = THREE.MathUtils.degToRad(100) * open;
        poseBusinessman(dt, t, moving, press);

        // Light: one gentle leak pulse at the start, then the flood as the door opens
        const pulse = t < 0.6 ? Math.sin((Math.PI * t) / 0.6) : 0;
        const light = smooth(T.openStart, T.openEnd, t);
        glowMat.color.copy(WARM).multiplyScalar(2.4 + 1.4 * pulse + 1.6 * light);
        roomFloor.material.color.copy(WARM).multiplyScalar(0.25 + 0.3 * pulse + 1.1 * light);
        doorLight.intensity = 95 * light;
        spill.material.opacity = 0.2 + 0.12 * pulse + 0.55 * light;
        leakMat.color.copy(WARM).multiplyScalar(2.6 + 2.2 * pulse);
        leakMat.opacity = 1 - smooth(T.openStart, T.openStart + 0.35, t);
        spill.scale.set(1 + 0.6 * light, 1 + 3.2 * light, 1);
        spill.position.z = DOOR_Z + 0.5 + 1.6 * light;
        bloom.strength = BLOOM * (1 + 0.6 * light);
        contact.material.opacity = 0.75 - 0.25 * light;

        // Camera: behind and slightly above, easing in; follows him through the door
        const a = smooth(T.walkStart, T.walkEnd, t);
        const c = smooth(T.openEnd, T.throughEnd, t);
        camOff.copy(CAM.a).lerp(CAM.b, a).lerp(CAM.c, c);
        const par = isTouch ? 0 : 1 - smooth(T.walkStart, T.walkStart + 0.5, t);
        mouse.sx += (mouse.x - mouse.sx) * Math.min(1, dt * 4);
        mouse.sy += (mouse.y - mouse.sy) * Math.min(1, dt * 4);
        camOff.applyAxisAngle(THREE.Object3D.DEFAULT_UP, -mouse.sx * THREE.MathUtils.degToRad(1.5) * par);
        camOff.y += -mouse.sy * 0.05 * par;
        camPos.set(x, 0, z).add(camOff);
        camera.position.copy(camPos);
        look.set(x * 0.5, 1.1 + 0.1 * c, z - 1.8);
        camera.lookAt(look);

        // Fill to cream as he steps through, then cross-fade into the real home page
        creamEl.style.opacity = String(Math.pow(smooth(T.openEnd + 0.2, T.throughEnd, t), 1.4));
        if (!frame && t > 2.0) preloadHome();
        if (!frameShown && t >= T.throughEnd) {
          frameShown = true;
          if (frameReady) frame.classList.add('show');
        }

        if (reflector) reflector.visible = c < 0.95;
        composer.render();

        if (t >= T.homeEnd) intro.exit();
      }

      intro.cleanup = () => {
        cancelAnimationFrame(rafId);
        window.removeEventListener('resize', fit);
        window.removeEventListener('mousemove', onMouse);
        scene.traverse((o) => {
          if (o.geometry) o.geometry.dispose();
          if (o.material) {
            for (const m of Array.isArray(o.material) ? o.material : [o.material]) {
              for (const k of ['map', 'roughnessMap', 'emissiveMap', 'normalMap', 'alphaMap']) if (m[k]) m[k].dispose();
              m.dispose();
            }
          }
        });
        if (reflector) reflector.dispose();
        bloom.dispose();
        rt.dispose();
        composer.renderTarget2.dispose();
        envRT.dispose();
        pmrem.dispose();
        renderer.dispose();
      };

      // Wait briefly for Inter (door plate text), then go.
      const fontsReady = document.fonts && document.fonts.load
        ? Promise.race([document.fonts.load('700 64px Inter'), new Promise((r) => setTimeout(r, 600))]).catch(() => { })
        : Promise.resolve();
      fontsReady.then(() => {
        plateText.material.map.dispose();
        plateText.material.map = plateTexture();
        plateText.material.needsUpdate = true;
        renderer.compile(scene, camera);
        start();
      });

      // ---------- Procedural textures ----------
      function radialTexture(inner, outer) {
        const c = document.createElement('canvas');
        c.width = c.height = 128;
        const g = c.getContext('2d');
        const grad = g.createRadialGradient(64, 64, 4, 64, 64, 64);
        grad.addColorStop(0, inner);
        grad.addColorStop(1, outer);
        g.fillStyle = grad;
        g.fillRect(0, 0, 128, 128);
        return new THREE.CanvasTexture(c);
      }

      function spillTexture() {
        // Bright at the door edge (top of the texture), fanning out and fading toward the camera.
        const c = document.createElement('canvas');
        c.width = 128; c.height = 256;
        const g = c.getContext('2d');
        for (let y = 0; y < 256; y++) {
          const k = y / 255;
          const halfW = 64 * (0.55 + 0.45 * k);
          const a = Math.pow(1 - k, 1.6);
          const grad = g.createLinearGradient(64 - halfW, 0, 64 + halfW, 0);
          grad.addColorStop(0, 'rgba(255,255,255,0)');
          grad.addColorStop(0.5, `rgba(255,255,255,${a})`);
          grad.addColorStop(1, 'rgba(255,255,255,0)');
          g.fillStyle = grad;
          g.fillRect(64 - halfW, y, halfW * 2, 1);
        }
        const tex = new THREE.CanvasTexture(c);
        tex.colorSpace = THREE.SRGBColorSpace;
        return tex;
      }

      function plateTexture() {
        const c = document.createElement('canvas');
        c.width = 540; c.height = 120;
        const g = c.getContext('2d');
        g.fillStyle = 'rgba(52, 26, 10, 0.92)';
        g.textAlign = 'center';
        g.textBaseline = 'middle';
        g.font = "700 64px Inter, 'Segoe UI', Arial, sans-serif";
        if ('letterSpacing' in g) g.letterSpacing = '4px';
        g.fillText('StartSmart', 270, 64);
        const tex = new THREE.CanvasTexture(c);
        tex.colorSpace = THREE.SRGBColorSpace;
        tex.anisotropy = 8;
        return tex;
      }
    }
  </script>
</body>
